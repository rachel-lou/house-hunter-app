<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chin House Hunt 🏡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyDOd8CN2k-PBxv5_wwdRYdjjJ2nFn7wx70",
      authDomain:        "house-hunter-b211d.firebaseapp.com",
      databaseURL:       "https://house-hunter-b211d-default-rtdb.firebaseio.com",
      projectId:         "house-hunter-b211d",
      storageBucket:     "house-hunter-b211d.firebasestorage.app",
      messagingSenderId: "394632511568",
      appId:             "1:394632511568:web:6342315041ec7d42f85155",
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);
    window._fbSubscribeRegion = (region, cb) => onValue(ref(db, `house-hunter/${region}`), snap => cb(snap.val()));
    window._fbSaveRegion      = (region, data) => set(ref(db, `house-hunter/${region}`), data);
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f1117; color: #e2e8f0; font-family: 'DM Sans', sans-serif; min-height: 100vh; }

    input, textarea, select {
      background: #1a1f2e; border: 1px solid #2d3748; color: #e2e8f0;
      border-radius: 8px; padding: 8px 12px; font-family: inherit;
      font-size: 14px; width: 100%; outline: none; transition: border-color .2s;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    input[type=date] { color-scheme: dark; }
    input[type=checkbox] { width: auto; accent-color: var(--accent); }
    input[type=range] {
      -webkit-appearance: none; height: 6px; border-radius: 3px;
      background: #2d3748; border: none; padding: 0; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent-gradient); cursor: pointer;
    }
    label { font-size: 12px; color: #94a3b8; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; display: block; margin-bottom: 4px; }

    .btn { cursor: pointer; border: none; border-radius: 8px; padding: 10px 20px; font-family: inherit; font-weight: 600; font-size: 14px; transition: all .2s; display: inline-block; }
    .btn-primary  { background: var(--accent-gradient); color: #fff; }
    .btn-primary:hover  { opacity: .9; transform: translateY(-1px); }
    .btn-secondary { background: #1e2535; color: #94a3b8; border: 1px solid #2d3748; }
    .btn-secondary:hover { background: #2d3748; color: #e2e8f0; }
    .btn-danger { background: transparent; color: #f87171; border: 1px solid #f87171; }
    .btn-danger:hover { background: #f87171; color: #fff; }
    .btn-sm { padding: 7px 14px; font-size: 13px; }

    body {
      --accent: #c084fc; --accent2: #818cf8;
      --accent-gradient: linear-gradient(135deg, #c084fc, #818cf8);
      --accent-glow: rgba(192,132,252,.1); --accent-dim: #c084fc20; --accent-border: #c084fc40;
    }
    body.tahoe {
      --accent: #38bdf8; --accent2: #34d399;
      --accent-gradient: linear-gradient(135deg, #38bdf8, #34d399);
      --accent-glow: rgba(56,189,248,.1); --accent-dim: #38bdf820; --accent-border: #38bdf840;
    }
    body.sf {
      --accent: #fb923c; --accent2: #f472b6;
      --accent-gradient: linear-gradient(135deg, #fb923c, #f472b6);
      --accent-glow: rgba(251,146,60,.1); --accent-dim: #fb923c20; --accent-border: #fb923c40;
    }

    #app { max-width: 940px; margin: 0 auto; padding: 0 16px 80px; }

    #header {
      background: #0d1018; border-bottom: 1px solid #1e2535;
      padding: 14px 24px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 100;
      flex-wrap: wrap; gap: 10px;
    }
    #header-left { display: flex; align-items: center; gap: 12px; }
    #header-title { font-family: 'Playfair Display', serif; font-size: 18px; color: #e2e8f0; }
    #header-sub { font-size: 11px; color: #64748b; font-family: 'DM Mono', monospace; }
    #header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    #region-tabs { display: flex; gap: 6px; }
    .region-tab {
      cursor: pointer; padding: 7px 18px; border-radius: 20px; font-size: 13px;
      font-weight: 600; transition: all .2s; border: 1px solid #2d3748;
      color: #64748b; background: #1a1f2e; white-space: nowrap;
    }
    .region-tab:hover { color: #94a3b8; border-color: #4a5568; }
    .region-tab.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-border); }

    #weights-panel { background: #11151f; border-bottom: 1px solid #1e2535; padding: 20px 24px; display: none; }
    #weights-panel.open { display: block; }
    #weights-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 16px; max-width: 860px; }
    .weight-badge { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--accent); background: var(--accent-dim); padding: 2px 8px; border-radius: 6px; }

    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1e2535; border: 1px solid #2d3748; color: #e2e8f0; padding: 10px 20px; border-radius: 10px; font-size: 14px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
    #toast.show { opacity: 1; }

    .house-card { background: #161b27; border: 1px solid #1e2535; border-radius: 16px; padding: 20px; transition: border-color .2s; margin-bottom: 12px; }
    .house-card:hover { border-color: var(--accent-border); }
    .card-top { display: flex; align-items: flex-start; gap: 14px; }
    .rank-badge { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-weight: 500; font-size: 14px; flex-shrink: 0; }
    .card-body { flex: 1; min-width: 0; }
    .card-title { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700; color: #e2e8f0; }
    .card-title-link { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700; color: #e2e8f0; text-decoration: none; border-bottom: 1px dashed var(--accent-border); transition: color .2s, border-color .2s; }
    .card-title-link:hover { color: var(--accent); border-bottom-color: var(--accent); }
    .card-addr { font-size: 13px; color: #64748b; margin: 2px 0 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 8px; padding: 3px 10px; font-size: 12px; }
    .chip-hl { background: #4ade8015; border-color: #4ade8040; }
    .chip span.lbl { color: #64748b; }
    .chip span.val { color: #cbd5e1; font-family: 'DM Mono', monospace; }
    .chip-hl span.val { color: #4ade80; font-weight: 700; }
    .viewed-badge { font-size: 11px; background: #4ade8020; color: #4ade80; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
    .score-pill { display: inline-block; padding: 4px 12px; border-radius: 20px; font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; }
    .card-notes { margin-top: 12px; padding: 10px 12px; background: #0f1117; border-radius: 8px; font-size: 13px; color: #94a3b8; font-style: italic; border-left: 3px solid var(--accent-border); }
    .card-notes-toggle { margin-top: 10px; display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: #64748b; background: none; border: none; padding: 0; font-family: inherit; transition: color .2s; }
    .card-notes-toggle:hover { color: var(--accent); }
    .card-notes-full { white-space: pre-wrap; }
    .btn-edit-card { background: #1e2535; border: 1px solid #2d3748; color: #94a3b8; border-radius: 8px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .2s; }
    .btn-edit-card:hover { background: var(--accent-gradient); color: #fff; border-color: transparent; }

    .score-ring-outer { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .score-ring-inner { width: 38px; height: 38px; border-radius: 50%; background: #161b27; display: flex; align-items: center; justify-content: center; }
    .score-ring-text { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 700; }

    .section-card { background: #161b27; border: 1px solid #1e2535; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    .section-title { font-size: 13px; font-weight: 600; color: #94a3b8; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 16px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 14px; }
    .computed-field { padding: 8px 12px; background: #0f1117; border-radius: 8px; font-size: 14px; font-family: 'DM Mono', monospace; }

    #edit-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
    #edit-title { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; }
    #edit-actions { display: flex; gap: 8px; }
    #url-bar { background: #161b27; border: 1px solid #1e2535; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    #url-row { display: flex; gap: 8px; }
    #url-row input { flex: 1; }
    #scores-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 20px; }
    .score-val { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 700; padding: 2px 10px; border-radius: 8px; }
    .score-ticks { display: flex; justify-content: space-between; font-size: 10px; color: #4a5568; margin-top: 2px; font-family: 'DM Mono', monospace; }
    .weighted-total { margin-top: 20px; padding: 16px; background: #0f1117; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
    .weighted-total-val { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; }

    #view-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .view-tab { cursor: pointer; padding: 8px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; transition: all .2s; color: #64748b; }
    .view-tab:hover { color: #94a3b8; }
    .view-tab.active { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent-border); }

    .alert { border-radius: 10px; padding: 10px 16px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; margin: 12px 0; }
    .alert-success { background: #4ade8015; border: 1px solid #4ade8040; color: #4ade80; }
    .alert-error   { background: #f8717115; border: 1px solid #f8717140; color: #f87171; }
    .alert-close { background: none; border: none; color: inherit; cursor: pointer; font-size: 16px; }

    #loading { display: flex; align-items: center; justify-content: center; height: 60vh; color: #64748b; font-family: 'DM Mono', monospace; }
    #config-screen { max-width: 600px; margin: 80px auto; text-align: center; padding: 40px; background: #161b27; border: 1px solid #1e2535; border-radius: 20px; display: none; }
    #config-screen h1 { font-family: 'Playfair Display', serif; font-size: 26px; margin-bottom: 12px; }
    #config-screen p  { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    #config-screen code { background: #0f1117; padding: 2px 6px; border-radius: 4px; font-family: 'DM Mono', monospace; font-size: 13px; color: var(--accent); }

    #footer { background: #0d1018; border-top: 1px solid #1e2535; padding: 14px 24px; position: sticky; bottom: 0; z-index: 100; }
    #footer-inner { max-width: 940px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }

    @media (max-width: 640px) {
      #header { padding: 12px 16px; }
      #header-actions { width: 100%; }
      #region-tabs { order: -1; width: 100%; }
    }
  </style>
</head>
<body>

<div id="loading">Loading your houses…</div>
<div id="config-screen">
  <div style="font-size:48px;margin-bottom:16px">🔧</div>
  <h1>Firebase Setup Needed</h1>
  <p>Open <code>index.html</code> in a text editor and replace the <code>firebaseConfig</code> block near the top with your own Firebase credentials. See the <strong>README.md</strong> for instructions.</p>
</div>

<div id="header" style="display:none">
  <div id="header-left">
    <span style="font-size:24px">🏡</span>
    <div>
      <div id="header-title">House Hunter</div>
      <div id="header-sub"></div>
    </div>
  </div>
  <div id="region-tabs">
    <div class="region-tab active" data-region="eastbay">🌉 East Bay</div>
    <div class="region-tab"       data-region="sf">🌁 SF</div>
    <div class="region-tab"       data-region="tahoe">🏔 Tahoe</div>
  </div>
  <div id="header-actions">
    <button class="btn btn-secondary btn-sm" id="btn-weights">⚙️ Weights</button>
    <button class="btn btn-primary btn-sm" id="btn-add">+ Add House</button>
  </div>
</div>

<div id="weights-panel">
  <div style="font-size:13px;color:#94a3b8;margin-bottom:16px;font-weight:600;letter-spacing:.05em;text-transform:uppercase">
    Category Weights for <span id="weights-region-label"></span> (1 = Low, 5 = High)
  </div>
  <div id="weights-grid"></div>
</div>

<div id="app" style="display:none">
  <div id="alert-area"></div>
  <div id="view-tabs" style="display:none"></div>
  <div id="view-rankings"></div>
  <div id="view-edit" style="display:none"></div>
</div>

<div id="footer" style="display:none">
  <div id="footer-inner">
    <span style="font-size:13px;color:#4a5568;font-family:'DM Mono',monospace">house-hunter</span>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn btn-secondary btn-sm" id="btn-export">⬇ Export CSV</button>
      <label class="btn btn-secondary btn-sm" style="cursor:pointer;margin:0">
        ⬆ Import CSV
        <input type="file" accept=".csv" id="csv-import-input" style="display:none" />
      </label>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">

// ── Region-specific category definitions ──────────────────────────────────────
const CATEGORIES_EASTBAY = [
  { id:"bart",     label:"Proximity to BART",    icon:"🚇" },
  { id:"grocery",  label:"Proximity to Grocery", icon:"🛒" },
  { id:"kitchen",  label:"Kitchen",              icon:"🍳" },
  { id:"flow",     label:"Flow",                 icon:"🌊" },
  { id:"flip",     label:"Opportunity to Flip",  icon:"💰" },
  { id:"school",   label:"School District",      icon:"🏫" },
  { id:"vibe",     label:"Vibe",                 icon:"✨" },
  { id:"finished", label:"How Finished It Is",   icon:"🔨" },
  { id:"privacy",  label:"Privacy",              icon:"🔒" },
];

const CATEGORIES_SF = [
  { id:"greenspace", label:"Proximity to Green Space",  icon:"🌳" },
  { id:"grocery",    label:"Proximity to Grocery",      icon:"🛒" },
  { id:"kitchen",    label:"Kitchen",                   icon:"🍳" },
  { id:"flow",       label:"Flow",                      icon:"🌊" },
  { id:"vibe",       label:"Vibe",                      icon:"✨" },
  { id:"finished",   label:"How Finished It Is",        icon:"🔨" },
  { id:"privacy",    label:"Privacy",                   icon:"🔒" },
];

const CATEGORIES_TAHOE = [
  { id:"slopes",      label:"Proximity to Slopes",  icon:"⛷️" },
  { id:"grocery",     label:"Proximity to Grocery", icon:"🛒" },
  { id:"kitchen",     label:"Kitchen",              icon:"🍳" },
  { id:"flow",        label:"Flow",                 icon:"🌊" },
  { id:"vibe",        label:"Vibe",                 icon:"✨" },
  { id:"maintenance", label:"Ease of Maintenance",  icon:"🔧" },
];

const REGIONS = { eastbay:{label:"East Bay",emoji:"🌉"}, sf:{label:"San Francisco",emoji:"🌁"}, tahoe:{label:"Tahoe",emoji:"🏔"} };
const getCategories = () => activeRegion === "tahoe" ? CATEGORIES_TAHOE : activeRegion === "sf" ? CATEGORIES_SF : CATEGORIES_EASTBAY;

// ── State ─────────────────────────────────────────────────────────────────────
const regionData = {
  eastbay: { houses:[], weights:Object.fromEntries(CATEGORIES_EASTBAY.map(c=>[c.id,3])) },
  sf:      { houses:[], weights:Object.fromEntries(CATEGORIES_SF.map(c=>[c.id,3]))      },
  tahoe:   { houses:[], weights:Object.fromEntries(CATEGORIES_TAHOE.map(c=>[c.id,3]))   },
};

let activeRegion = "eastbay";
let editingId    = null;
let editForm     = null;
let activeView   = "rankings";

const R       = () => regionData[activeRegion];
const houses  = () => R().houses;
const weights = () => R().weights;

const emptyHouse = () => ({
  id:Date.now().toString(), nickname:"", address:"", listPrice:"",
  predictedSellPrice:"", upgradeEstimate:"", hoa:"", sqFeet:"", beds:"", baths:"",
  garage:"", yearBuilt:"", dateListed:"", viewed:false, sold:false, soldPrice:"",
  listingUrl:"", notes:"",
  scores:Object.fromEntries(getCategories().map(c=>[c.id,5])),
});

// ── Helpers ───────────────────────────────────────────────────────────────────
const fmt$ = v => { const n=parseFloat(String(v||"").replace(/[^0-9.]/g,"")); return isNaN(n)?"":"$"+n.toLocaleString(); };

const ppsf = h => {
  const p=parseFloat(String(h.listPrice||"").replace(/[^0-9.]/g,"")), q=parseFloat(h.sqFeet);
  return (!p||!q)?"—":"$"+Math.round(p/q).toLocaleString()+"/sqft";
};

// Bay Area final price: predicted sell + upgrade estimate
const finalPriceBayArea = h => {
  const s=parseFloat(String(h.predictedSellPrice||"").replace(/[^0-9.]/g,""));
  const u=parseFloat(String(h.upgradeEstimate||"").replace(/[^0-9.]/g,""));
  return (!s&&!u)?null:(s||0)+(u||0);
};

const computeScore=(scores,wts,cats)=>{
  let t=0,m=0; for(const c of cats){const w=wts[c.id]||1;t+=(scores[c.id]||0)*w;m+=10*w;}
  return m===0?0:Math.round(t/m*100);
};
const scoreColor=s=>s>=75?"#4ade80":s>=50?"#facc15":"#f87171";
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function toast(msg,dur=2500){
  const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),dur);
}
function showAlert(msg,type="success"){
  document.getElementById("alert-area").innerHTML=
    `<div class="alert alert-${type}">${esc(msg)}<button class="alert-close" onclick="this.parentElement.remove()">×</button></div>`;
}

// ── Firebase ──────────────────────────────────────────────────────────────────
const isConfigured=()=>typeof window._fbSaveRegion==="function";
const fbKey=region=>region==="eastbay"?"bayarea":region;
const saveToFirebase=()=>{ if(isConfigured()) window._fbSaveRegion(fbKey(activeRegion),R()).catch(e=>toast("⚠️ "+e.message,4000)); };

// ── Region switching ──────────────────────────────────────────────────────────
function switchRegion(region){
  if(region===activeRegion) return;
  editingId=null; editForm=null; activeView="rankings";
  activeRegion=region;
  document.body.classList.toggle("tahoe", region==="tahoe");
  document.body.classList.toggle("sf", region==="sf");
  document.querySelectorAll(".region-tab").forEach(t=>t.classList.toggle("active",t.dataset.region===region));
  renderAll();
}

// ── Render all ────────────────────────────────────────────────────────────────
function renderAll(){
  const h=houses(), r=REGIONS[activeRegion];
  document.getElementById("header-sub").textContent=
    `${r.emoji} ${r.label} · ${h.filter(x=>!x.sold).length} active · ${h.length} total`;
  document.getElementById("weights-region-label").textContent=r.label;
  renderWeightsPanel();
  if(editingId&&activeView==="edit") renderEdit();
  else renderRankings();
  renderViewTabs();
}

function renderViewTabs(){
  const tabs=document.getElementById("view-tabs");
  if(!editingId){tabs.style.display="none";return;}
  tabs.style.display="flex";
  const name=editingId==="new"?"➕ New House":`✏️ ${editForm?.nickname||"Editing"}`;
  tabs.innerHTML=`
    <div class="view-tab ${activeView==="rankings"?"active":""}" id="vtab-r">Rankings</div>
    <div class="view-tab ${activeView==="edit"?"active":""}"     id="vtab-e">${esc(name)}</div>`;
  document.getElementById("vtab-r").onclick=()=>{activeView="rankings";renderAll();};
  document.getElementById("vtab-e").onclick=()=>{activeView="edit";renderAll();};
}

function renderRankings(){
  document.getElementById("view-edit").style.display="none";
  const el=document.getElementById("view-rankings"); el.style.display="block";
  const h=houses(), wts=weights(), cats=getCategories(), r=REGIONS[activeRegion];
  const isTahoe=activeRegion==="tahoe";
  const isEastBay=activeRegion==="eastbay";

  if(h.length===0){
    el.innerHTML=`<div style="text-align:center;padding:80px 20px">
      <div style="font-size:48px;margin-bottom:16px">${r.emoji}</div>
      <div style="font-size:18px;font-family:'Playfair Display',serif;color:#64748b;margin-bottom:8px">No ${r.label} houses yet</div>
      <div style="font-size:14px;color:#4a5568;margin-bottom:24px">Add your first property to get started</div>
      <button class="btn btn-primary" id="empty-add">Add First House</button>
    </div>`;
    document.getElementById("empty-add").onclick=startAdd; return;
  }

  const sorted=[...h].sort((a,b)=>{
    if(a.sold&&!b.sold)return 1; if(!a.sold&&b.sold)return -1;
    return computeScore(b.scores,wts,cats)-computeScore(a.scores,wts,cats);
  });
  const activeH=sorted.filter(x=>!x.sold);
  const rankColors=["#ffd700","#c0c0c0","#cd7f32"];

const fld=(label,key,value,ph)=>`<div><label>${esc(label)}</label><input data-field="${key}" value="${esc(value||"")}" placeholder="${esc(ph)}"/></div>`;

// ── Actions ───────────────────────────────────────────────────────────────────
function startAdd()   { editForm=emptyHouse(); editingId="new"; activeView="edit"; renderAll(); }
function startEdit(h) { editForm={...h,scores:{...h.scores}}; editingId=h.id; activeView="edit"; renderAll(); }
function cancelEdit() { editForm=null; editingId=null; activeView="rankings"; renderAll(); }
function saveForm(){
  if(!editForm) return;
  editForm.listingUrl=document.getElementById("url-input")?.value||editForm.listingUrl;
  if(editingId==="new") R().houses=[...houses(),editForm];
  else R().houses=houses().map(x=>x.id===editingId?editForm:x);
  saveToFirebase(); editForm=null; editingId=null; activeView="rankings"; renderAll(); toast("✅ House saved!");
}
function deleteHouse(id){
  if(!confirm("Remove this house?")) return;
  R().houses=houses().filter(h=>h.id!==id);
  saveToFirebase(); editForm=null; editingId=null; activeView="rankings"; renderAll(); toast("🗑 House removed");
}

// ── Auto-fill ─────────────────────────────────────────────────────────────────
async function doAutofill(){
  const url=document.getElementById("url-input")?.value?.trim(); if(!url) return;
  const btn=document.getElementById("btn-af"); btn.textContent="Loading…"; btn.disabled=true;
  try {
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,
        messages:[{role:"user",content:`Given this real estate listing URL: ${url}
Return ONLY a JSON object (no markdown): {"nickname":"","address":"","listPrice":"","sqFeet":"","beds":"","baths":"","garage":"","yearBuilt":"","dateListed":"","hoa":""}
listPrice/hoa = number only. beds/baths = number only. garage = "Yes"/"No"/number. dateListed = YYYY-MM-DD. hoa = monthly amount if listed.`}]})
    });
    const data=await res.json();
    const text=(data.content||[]).map(b=>b.text||"").join("");
    Object.assign(editForm,JSON.parse(text.replace(/```json|```/g,"").trim()),{listingUrl:url});
    renderEdit();
  } catch(e){ showAlert("Could not auto-populate — please fill in manually.","error"); }
  btn.textContent="✨ Auto-fill"; btn.disabled=false;
}

// ── CSV ───────────────────────────────────────────────────────────────────────
function exportCSV(){
  const cats=getCategories();
  const catH=cats.map(c=>`score_${c.id}`);
  const headers=["id","nickname","address","listPrice","predictedSellPrice","upgradeEstimate","hoa","sqFeet","beds","baths","garage","yearBuilt","dateListed","viewed","sold","listingUrl","notes",...catH];
  const wts=weights();
  const wRow=["WEIGHTS","","","","","","","","","","","","","","","","","",...cats.map(c=>wts[c.id]||3)];
  const rows=houses().map(h=>[
    h.id,h.nickname,h.address,h.listPrice,h.predictedSellPrice,h.upgradeEstimate||"",h.hoa||"",
    h.sqFeet,h.beds,h.baths,h.garage,h.yearBuilt,h.dateListed,
    h.viewed?"true":"false",h.sold?"true":"false",h.listingUrl,
    `"${(h.notes||"").replace(/"/g,'""')}"`,
    ...cats.map(c=>h.scores[c.id]??5),
  ]);
  const csv=[headers,wRow,...rows].map(r=>r.join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download=`house-hunter-${activeRegion}.csv`; a.click();
}

function importCSV(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const cats=getCategories();
      const lines=ev.target.result.split("\n").filter(l=>l.trim());
      const headers=lines[0].split(","); const imported=[]; let newW={...weights()};
      for(let i=1;i<lines.length;i++){
        const cols=[]; let cur="",inQ=false;
        for(const ch of lines[i]){if(ch==='"'){inQ=!inQ;}else if(ch===","&&!inQ){cols.push(cur);cur="";}else cur+=ch;}
        cols.push(cur);
        const get=n=>(cols[headers.indexOf(n)]||"").trim();
        if(get("id")==="WEIGHTS"){cats.forEach(c=>{const v=parseInt(get(`score_${c.id}`));if(!isNaN(v))newW[c.id]=v;});continue;}
        const scores={}; cats.forEach(c=>{const v=parseInt(get(`score_${c.id}`));scores[c.id]=isNaN(v)?5:v;});
        imported.push({id:get("id")||Date.now()+i,nickname:get("nickname"),address:get("address"),listPrice:get("listPrice"),predictedSellPrice:get("predictedSellPrice"),upgradeEstimate:get("upgradeEstimate"),hoa:get("hoa"),sqFeet:get("sqFeet"),beds:get("beds"),baths:get("baths"),garage:get("garage"),yearBuilt:get("yearBuilt"),dateListed:get("dateListed"),viewed:get("viewed")==="true",sold:get("sold")==="true",listingUrl:get("listingUrl"),notes:get("notes").replace(/""/g,'"'),scores});
      }
      if(!imported.length){showAlert("No houses found in CSV.","error");return;}
      R().houses=imported; R().weights=newW; saveToFirebase(); renderAll();
      showAlert(`✅ Imported ${imported.length} houses into ${REGIONS[activeRegion].label}!`);
    }catch(err){showAlert("❌ Failed to parse CSV.","error");}
  };
  reader.readAsText(file); e.target.value="";
}

// ── Boot ──────────────────────────────────────────────────────────────────────
window.addEventListener("load",()=>{
  setTimeout(()=>{
    if(!isConfigured()){
      document.getElementById("loading").style.display="none";
      document.getElementById("config-screen").style.display="block";
      return;
    }

    let booted=false;
    ["eastbay","sf","tahoe"].forEach(region=>{
      window._fbSubscribeRegion(fbKey(region), data=>{
        if(data){
          regionData[region].houses=data.houses||[];
          // Restore only weights that belong to this region's categories
          const cats=region==="tahoe"?CATEGORIES_TAHOE:region==="sf"?CATEGORIES_SF:CATEGORIES_EASTBAY;
          const saved=data.weights||{};
          regionData[region].weights=Object.fromEntries(cats.map(c=>[c.id,saved[c.id]||3]));
        }
        if(!booted&&region==="eastbay"){
          booted=true;
          document.getElementById("loading").style.display="none";
          document.getElementById("header").style.display="flex";
          document.getElementById("footer").style.display="block";
          document.getElementById("app").style.display="block";
        }
        if(region===activeRegion) renderAll();
      });
    });

    document.querySelectorAll(".region-tab").forEach(tab=>{ tab.onclick=()=>switchRegion(tab.dataset.region); });
    document.getElementById("btn-weights").onclick=()=>document.getElementById("weights-panel").classList.toggle("open");
    document.getElementById("btn-export").onclick=exportCSV;
    document.getElementById("btn-add").onclick=startAdd;
    document.getElementById("csv-import-input").onchange=importCSV;
  },300);
});
</script>
</body>
</html>
